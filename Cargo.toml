[package]
name = "ShaderJoy"
version = "0.1.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.16", features = ["derive"] }
pollster = "0.3"
wgpu = "0.19"
winit = "0.29"
egui = "0.27"
egui-wgpu = "0.27"
egui-winit = "0.27"
llm = { version = "1.3", default-features = false, features = [
    "google",
    "openai",
    "anthropic",
    "default-tls",
] }
naga = { version = "28", features = ["wgsl-in"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
